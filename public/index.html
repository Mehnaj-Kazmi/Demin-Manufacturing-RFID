<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Denim RFID Track &amp; Trace</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="login" class="login-screen">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-brand">
      <div class="login-mark">RFID</div>
      <div>
        <h1>Denim Track &amp; Trace</h1>
        <p>Manufacturing Execution System</p>
      </div>
    </div>
    <label>Username
      <input type="text" name="username" id="login-user" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" id="login-pass" autocomplete="current-password" required>
    </label>
    <div class="login-error" id="login-error" hidden></div>
    <button type="submit" class="btn btn-primary btn-lg btn-block">Sign in</button>
    <p class="login-hint">Station accounts are issued by your supervisor.</p>
  </form>
</div>

<div id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">RFID</div>
      <div class="brand-text">
        <strong>Denim Track &amp; Trace</strong>
        <span id="brand-shift">Shift -</span>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="who">
        <div class="avatar" id="who-avatar">?</div>
        <div>
          <strong id="who-name">-</strong>
          <span id="who-role">-</span>
        </div>
      </div>
      <div class="sidebar-actions">
        <button class="btn btn-ghost btn-sm" id="theme-toggle" title="Switch light / dark">Theme</button>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="btn btn-ghost menu-btn" id="menu-btn" aria-label="Menu">&#9776;</button>
      <div class="topbar-title">
        <h1 id="page-title">Dashboard</h1>
        <p id="page-sub"></p>
      </div>
      <div class="topbar-tools" id="page-tools"></div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div id="toasts" class="toasts"></div>
<div id="modal-root"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
